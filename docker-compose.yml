services:
    mongo1:
        image: mongo:7.0
        command: ["--replSet", "rs0", "--bind_ip_all", "--port", "30001"]
        ports:
            - 30001:30001
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:30001',priority:1},{_id:1,host:'host.docker.internal:30002',priority:0.5},{_id:2,host:'host.docker.internal:30003',priority:0.5}]}) }" | mongosh --port 30001 --quiet
            interval: 5s
            timeout: 30s
            start_period: 0s
            start_interval: 1s
            retries: 30
        volumes:
            - "mongo1_data:/data/db"
            - "mongo1_config:/data/configdb"

    mongo2:
        image: mongo:7.0
        command: ["--replSet", "rs0", "--bind_ip_all", "--port", "30002"]
        ports:
            - 30002:30002
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - "mongo2_data:/data/db"
            - "mongo2_config:/data/configdb"

    mongo3:
        image: mongo:7.0
        command: ["--replSet", "rs0", "--bind_ip_all", "--port", "30003"]
        ports:
            - 30003:30003
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - "mongo3_data:/data/db"
            - "mongo3_config:/data/configdb"

volumes:
    mongo1_data:
    mongo2_data:
    mongo3_data:
    mongo1_config:
    mongo2_config:
    mongo3_config:
